<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矿井提升系统运行剖面图</title>
<style>
:root {
  --bg-primary: #0c1220;
  --bg-secondary: #131c2e;
  --bg-tertiary: #1a2540;
  --bg-diagram: #0a0f1a;
  --border: rgba(100,160,220,0.15);
  --border-active: rgba(100,180,255,0.4);
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-dim: #475569;
  --accent-blue: #60a5fa;
  --accent-cyan: #22d3ee;
  --accent-green: #34d399;
  --accent-amber: #fbbf24;
  --accent-red: #f87171;
  --accent-purple: #a78bfa;
  --font-mono: 'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;
  --font-sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --gap: 16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);display:grid;grid-template-rows:auto 1fr auto}
.site-header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-secondary)}
.site-header h1{font-size:1.15rem;font-weight:700;letter-spacing:0.02em}
.site-header h1 span{color:var(--accent-blue)}
.site-header p{font-size:0.8rem;color:var(--text-muted);margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}
.cycle-badge{font-family:var(--font-mono);font-size:0.75rem;color:var(--accent-cyan);background:rgba(34,211,238,0.08);border:1px solid rgba(34,211,238,0.2);padding:3px 10px;border-radius:4px}
.running-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);transition:background 0.3s}
.running-dot.active{background:var(--accent-green);animation:blink 1s ease-in-out infinite}
.content-grid{display:grid;grid-template-columns:1fr 340px;gap:var(--gap);padding:var(--gap);max-width:1600px;margin:0 auto;width:100%;min-height:0}
.main-col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.side-col{display:flex;flex-direction:column;gap:var(--gap)}
.panel{background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:16px 20px}
.panel__header{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:0.8rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.05em}
.panel__dot{width:6px;height:6px;border-radius:50%}
.diagram-panel{flex:1;min-height:600px;padding:0;overflow:hidden;background:var(--bg-diagram);position:relative}
.diagram-panel svg{width:100%;height:100%;display:block}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.chart-svg{width:100%;height:180px;display:block;background:var(--bg-diagram);border-radius:6px}
.telemetry-item{padding:10px 0;border-bottom:1px solid var(--border)}
.telemetry-item:last-child{border-bottom:none}
.telemetry-label{font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px}
.telemetry-value{font-family:var(--font-mono);font-size:1.5rem;font-weight:700;line-height:1.2}
.telemetry-unit{font-size:0.7rem;color:var(--text-muted);font-weight:400;margin-left:3px}
.telemetry-sub{font-size:0.7rem;color:var(--text-dim);margin-top:2px}
.telemetry-bar{height:4px;background:var(--bg-tertiary);border-radius:2px;margin-top:6px;overflow:hidden}
.telemetry-bar__fill{height:100%;border-radius:2px;transition:width 80ms linear}
.bar-cyan{background:linear-gradient(90deg,#22d3ee,#3b82f6)}
.bar-purple{background:linear-gradient(90deg,#a78bfa,#ec4899)}
.c-blue{color:var(--accent-blue)}.c-green{color:var(--accent-green)}.c-cyan{color:var(--accent-cyan)}.c-amber{color:var(--accent-amber)}.c-purple{color:var(--accent-purple)}
.stage-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:6px 8px;border-radius:4px;font-size:0.8rem;border-left:2px solid transparent;transition:background 150ms,border-color 150ms}
.stage-row--active{background:rgba(96,165,250,0.08);border-left-color:var(--accent-blue)}
.stage-row__name{color:var(--text-secondary)}
.stage-row__force{color:var(--text-dim);font-family:var(--font-mono);font-size:0.7rem}
.stage-row__time{color:var(--text-dim);font-family:var(--font-mono);font-size:0.7rem}
.ctrl-buttons{display:flex;gap:10px}
.btn{flex:1;padding:10px 14px;border-radius:8px;font-weight:600;font-size:0.9rem;color:#fff;border:none;cursor:pointer;transition:all 0.2s;font-family:var(--font-sans)}
.btn-start{background:var(--accent-green)}
.btn-start:hover{background:#059669}
.btn-start.running{background:var(--accent-red)}
.btn-start.running:hover{background:#dc2626}
.btn-reset{background:#475569;flex:0 0 auto;padding:10px 18px}
.btn-reset:hover{background:#334155}
.params-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.param-item{font-size:0.75rem}
.param-item .pk{color:var(--text-dim)}
.param-item .pv{color:var(--text-secondary);font-family:var(--font-mono)}
@keyframes pulse{0%,100%{r:4;opacity:1}50%{r:7;opacity:0.5}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.chart-point--pulse{animation:pulse 1.2s ease-in-out infinite}
.site-footer{padding:10px 24px;border-top:1px solid var(--border);text-align:center;font-size:0.75rem;color:var(--text-dim);font-family:var(--font-mono)}
@media(min-width:1440px){.content-grid{grid-template-columns:1fr 380px;gap:20px}.diagram-panel{min-height:700px}}
@media(max-width:1023px){.content-grid{grid-template-columns:1fr}.diagram-panel{min-height:500px;max-height:70vh}.charts-row{grid-template-columns:1fr}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg-primary)}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
</style>
</head>
<body>

<header class="site-header">
  <div>
    <h1><span>矿井提升系统</span> 运行剖面图</h1>
    <p>多绳摩擦提升机 · 箕斗运行模拟 · 工程剖面</p>
  </div>
  <div class="header-right">
    <span class="cycle-badge" id="cycleBadge">CYCLE 0.0%</span>
    <div class="running-dot" id="runningDot"></div>
  </div>
</header>

<div class="content-grid">
  <div class="main-col">
    <div class="diagram-panel panel">
      <svg id="crossSection" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="pat-grid-minor" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(100,140,200,0.04)" stroke-width="0.5"/>
          </pattern>
          <pattern id="pat-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#pat-grid-minor)"/>
            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(100,140,200,0.08)" stroke-width="0.75"/>
          </pattern>
          <pattern id="pat-concrete" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="12" height="12" fill="#1e2a3a"/>
            <line x1="0" y1="0" x2="0" y2="12" stroke="#3b4f66" stroke-width="1"/>
            <line x1="6" y1="0" x2="6" y2="12" stroke="#2d3e52" stroke-width="0.5"/>
          </pattern>
          <pattern id="pat-earth" width="16" height="16" patternUnits="userSpaceOnUse">
            <rect width="16" height="16" fill="#1a1510"/>
            <line x1="0" y1="16" x2="6" y2="10" stroke="#3d3020" stroke-width="0.7"/>
            <line x1="10" y1="16" x2="16" y2="10" stroke="#3d3020" stroke-width="0.7"/>
            <circle cx="3" cy="4" r="0.8" fill="#4a3a28"/>
            <circle cx="11" cy="6" r="0.6" fill="#4a3a28"/>
            <circle cx="7" cy="12" r="0.7" fill="#3d3020"/>
            <circle cx="14" cy="2" r="0.5" fill="#4a3a28"/>
          </pattern>
          <pattern id="pat-steel" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#2a3344"/>
            <path d="M0,0 L8,8 M8,0 L0,8" stroke="#4a5a6e" stroke-width="0.6"/>
          </pattern>
          <marker id="arrow-start" viewBox="0 0 10 6" refX="0" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse">
            <path d="M10,0 L0,3 L10,6 Z" fill="rgba(96,165,250,0.5)"/>
          </marker>
          <marker id="arrow-end" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto">
            <path d="M0,0 L10,3 L0,6 Z" fill="rgba(96,165,250,0.5)"/>
          </marker>
          <filter id="glow-rope" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-point" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
          </filter>
        </defs>

        <!-- Background + grid -->
        <rect width="800" height="1400" fill="#0a0f1a"/>
        <rect width="800" height="1400" fill="url(#pat-grid-major)"/>

        <!-- ===== Ground / Earth Fill ===== -->
        <g class="layer-ground">
          <rect x="0" y="140" width="280" height="1200" fill="url(#pat-earth)"/>
          <rect x="520" y="140" width="280" height="1200" fill="url(#pat-earth)"/>
          <line x1="0" y1="140" x2="280" y2="140" stroke="#5c4a32" stroke-width="2"/>
          <line x1="520" y1="140" x2="800" y2="140" stroke="#5c4a32" stroke-width="2"/>
        </g>

        <!-- ===== Installation Floor ===== -->
        <g class="layer-floor">
          <rect x="0" y="110" width="800" height="30" fill="url(#pat-steel)" stroke="#8899aa" stroke-width="1"/>
          <line x1="0" y1="140" x2="800" y2="140" stroke="#8899aa" stroke-width="1.5" stroke-dasharray="6 3"/>
        </g>

        <!-- ===== Shaft Walls + Sump ===== -->
        <g class="layer-shaft">
          <rect x="280" y="140" width="30" height="1200" fill="url(#pat-concrete)" stroke="#6b82a0" stroke-width="1"/>
          <rect x="490" y="140" width="30" height="1200" fill="url(#pat-concrete)" stroke="#6b82a0" stroke-width="1"/>
          <rect x="310" y="140" width="180" height="1200" fill="#070c16"/>
          <!-- Shaft bottom -->
          <line x1="280" y1="1280" x2="520" y2="1280" stroke="#6b82a0" stroke-width="1.5"/>
          <!-- Sump area (tail rope loop) -->
          <rect x="310" y="1280" width="180" height="120" fill="#050810"/>
          <line x1="280" y1="1400" x2="520" y2="1400" stroke="#6b82a0" stroke-width="1"/>
        </g>

        <!-- ===== Depth Markers ===== -->
        <g class="layer-depth">
          <line x1="530" y1="160" x2="530" y2="1030" stroke="rgba(71,85,105,0.3)" stroke-width="0.5"/>
          <line x1="525" y1="160" x2="540" y2="160" stroke="#475569" stroke-width="0.75"/>
          <text x="545" y="164" fill="#475569" font-family="var(--font-mono)" font-size="10">0m</text>
          <line x1="525" y1="377" x2="540" y2="377" stroke="#475569" stroke-width="0.75"/>
          <text x="545" y="381" fill="#475569" font-family="var(--font-mono)" font-size="10">171m</text>
          <line x1="525" y1="594" x2="540" y2="594" stroke="#475569" stroke-width="0.75"/>
          <text x="545" y="598" fill="#475569" font-family="var(--font-mono)" font-size="10">343m</text>
          <line x1="525" y1="812" x2="540" y2="812" stroke="#475569" stroke-width="0.75"/>
          <text x="545" y="816" fill="#475569" font-family="var(--font-mono)" font-size="10">514m</text>
          <line x1="525" y1="1030" x2="540" y2="1030" stroke="#475569" stroke-width="0.75"/>
          <text x="545" y="1034" fill="#475569" font-family="var(--font-mono)" font-size="10">686m</text>
        </g>

        <!-- ===== Dimension Lines ===== -->
        <g class="layer-dims">
          <line x1="255" y1="160" x2="255" y2="1030" stroke="rgba(96,165,250,0.3)" stroke-width="0.75"
                marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
          <text x="250" y="595" fill="rgba(96,165,250,0.6)" font-family="var(--font-mono)" font-size="10"
                text-anchor="end" transform="rotate(-90,250,595)">H = 685.7m</text>
          <line x1="250" y1="160" x2="260" y2="160" stroke="rgba(96,165,250,0.3)" stroke-width="0.75"/>
          <line x1="250" y1="1030" x2="260" y2="1030" stroke="rgba(96,165,250,0.3)" stroke-width="0.75"/>
        </g>

        <!-- ===== Annotations ===== -->
        <g class="layer-annotations">
          <rect x="20" y="115" width="110" height="18" rx="3" fill="rgba(10,15,26,0.85)"/>
          <text x="26" y="128" fill="#94a3b8" font-family="var(--font-sans)" font-size="10">提升机安装层</text>
          <rect x="20" y="145" width="100" height="18" rx="3" fill="rgba(10,15,26,0.85)"/>
          <text x="26" y="158" fill="#94a3b8" font-family="var(--font-sans)" font-size="10">井口地面 ±0.000</text>
          <rect x="530" y="1035" width="90" height="18" rx="3" fill="rgba(10,15,26,0.85)"/>
          <text x="536" y="1048" fill="#94a3b8" font-family="var(--font-sans)" font-size="10">井底装载位置</text>
          <rect x="315" y="145" width="90" height="18" rx="3" fill="rgba(10,15,26,0.85)"/>
          <text x="321" y="158" fill="#94a3b8" font-family="var(--font-sans)" font-size="10">井口卸载位置</text>
          <rect x="20" y="1305" width="80" height="16" rx="3" fill="rgba(10,15,26,0.85)"/>
          <text x="26" y="1317" fill="#64748b" font-family="var(--font-sans)" font-size="9">尾绳配重环</text>
        </g>

        <!-- ===== Drum (主导轮) — radius 60, ropes hang from left/right edges ===== -->
        <g id="drum" transform="rotate(0, 400, 80)">
          <circle cx="400" cy="80" r="60" fill="#6b7f99" stroke="#a0b4cc" stroke-width="2.5"/>
          <circle cx="400" cy="80" r="50" fill="none" stroke="rgba(160,180,204,0.3)" stroke-width="1"/>
          <circle cx="400" cy="80" r="42" fill="none" stroke="rgba(160,180,204,0.15)" stroke-width="0.75"/>
          <!-- Spokes (8) -->
          <line x1="345" y1="80" x2="455" y2="80" stroke="rgba(160,180,204,0.25)" stroke-width="1"/>
          <line x1="400" y1="25" x2="400" y2="135" stroke="rgba(160,180,204,0.25)" stroke-width="1"/>
          <line x1="358" y1="38" x2="442" y2="122" stroke="rgba(160,180,204,0.15)" stroke-width="0.75"/>
          <line x1="442" y1="38" x2="358" y2="122" stroke="rgba(160,180,204,0.15)" stroke-width="0.75"/>
          <!-- Hub -->
          <circle cx="400" cy="80" r="14" fill="#1a2540" stroke="#a0b4cc" stroke-width="2"/>
          <circle cx="400" cy="80" r="5" fill="#475569"/>
          <!-- Bolts (8 around hub) -->
          <circle cx="400" cy="25" r="4" fill="#1a2540" stroke="#a0b4cc" stroke-width="1"/>
          <circle cx="400" cy="135" r="4" fill="#1a2540" stroke="#a0b4cc" stroke-width="1"/>
          <circle cx="345" cy="80" r="4" fill="#1a2540" stroke="#a0b4cc" stroke-width="1"/>
          <circle cx="455" cy="80" r="4" fill="#1a2540" stroke="#a0b4cc" stroke-width="1"/>
          <circle cx="362" cy="42" r="3" fill="#1a2540" stroke="#a0b4cc" stroke-width="0.75"/>
          <circle cx="438" cy="42" r="3" fill="#1a2540" stroke="#a0b4cc" stroke-width="0.75"/>
          <circle cx="362" cy="118" r="3" fill="#1a2540" stroke="#a0b4cc" stroke-width="0.75"/>
          <circle cx="438" cy="118" r="3" fill="#1a2540" stroke="#a0b4cc" stroke-width="0.75"/>
        </g>
        <!-- Drum label -->
        <rect x="468" y="20" width="100" height="18" rx="3" fill="rgba(10,15,26,0.85)"/>
        <text x="474" y="33" fill="#94a3b8" font-family="var(--font-mono)" font-size="10">主导轮 D=5m</text>

        <!-- ===== Ropes ===== -->
        <!-- Left ropes: vertical from drum left edge (x=340) straight down to left skip -->
        <!-- Right ropes: vertical from drum right edge (x=460) straight down to right skip -->
        <g class="layer-ropes">
          <path id="rope-left-glow" d="" fill="none" stroke="rgba(245,158,11,0.12)" stroke-width="10" stroke-linecap="round"/>
          <path id="rope-left-1" d="" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
          <path id="rope-left-2" d="" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <path id="rope-left-3" d="" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <path id="rope-right-glow" d="" fill="none" stroke="rgba(245,158,11,0.12)" stroke-width="10" stroke-linecap="round"/>
          <path id="rope-right-1" d="" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
          <path id="rope-right-2" d="" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <path id="rope-right-3" d="" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
          <!-- Tail rope: balance rope with fixed length, natural catenary sag -->
          <path id="tail-rope-glow" d="" fill="none" stroke="rgba(100,116,139,0.12)" stroke-width="7" stroke-linecap="round"/>
          <path id="tail-rope" d="" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
        </g>

        <!-- ===== Left Skip (空载) — centered at x=340, width 36 ===== -->
        <g id="skip-left" transform="translate(0,0)">
          <polygon points="330,0 350,0 356,16 324,16" fill="#3d4a5c" stroke="#8899aa" stroke-width="1"/>
          <rect x="322" y="18" width="36" height="76" rx="4" fill="#d97706" stroke="#f59e0b" stroke-width="1.5"/>
          <line x1="326" y1="36" x2="354" y2="36" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <line x1="326" y1="56" x2="354" y2="56" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <line x1="326" y1="76" x2="354" y2="76" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <text x="340" y="50" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">空载</text>
          <text x="340" y="64" fill="#e2e8f0" font-size="7" text-anchor="middle">左箕斗</text>
        </g>

        <!-- ===== Right Skip (重载) — centered at x=460, width 36 ===== -->
        <g id="skip-right" transform="translate(0,0)">
          <polygon points="450,0 470,0 476,16 444,16" fill="#3d4a5c" stroke="#8899aa" stroke-width="1"/>
          <rect x="442" y="18" width="36" height="76" rx="4" fill="#16a34a" stroke="#22c55e" stroke-width="1.5"/>
          <line x1="446" y1="36" x2="474" y2="36" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <line x1="446" y1="56" x2="474" y2="56" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <line x1="446" y1="76" x2="474" y2="76" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <text x="460" y="50" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">重载</text>
          <text x="460" y="64" fill="#e2e8f0" font-size="7" text-anchor="middle">右箕斗</text>
        </g>

        <!-- ===== Dynamic Annotations ===== -->
        <text id="anno-left" x="310" y="0" fill="#94a3b8" font-family="var(--font-sans)" font-size="9" text-anchor="end"></text>
        <text id="anno-right" x="490" y="0" fill="#94a3b8" font-family="var(--font-sans)" font-size="9"></text>
        <text id="tail-rope-label" x="400" y="0" fill="#475569" font-family="var(--font-sans)" font-size="9" text-anchor="middle">尾绳</text>
      </svg>
    </div>

    <!-- Charts -->
    <div class="charts-row">
      <div class="panel">
        <div class="panel__header"><div class="panel__dot" style="background:#22c55e"></div>速度图</div>
        <svg id="speedChart" class="chart-svg" viewBox="0 0 400 200"></svg>
      </div>
      <div class="panel">
        <div class="panel__header"><div class="panel__dot" style="background:#a78bfa"></div>力图</div>
        <svg id="forceChart" class="chart-svg" viewBox="0 0 400 200"></svg>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="side-col">
    <div class="panel">
      <div class="panel__header"><div class="panel__dot" style="background:#f87171"></div>控制面板</div>
      <div class="ctrl-buttons">
        <button class="btn btn-start" id="btnStart">▶ 开始</button>
        <button class="btn btn-reset" id="btnReset">⟲ 重置</button>
      </div>
    </div>

<script>
// ==================== STAGE DATA ====================
const STAGES = [
  { name: '加速阶段', duration: 20.20, vStart: 0, vEnd: 14.14, distance: 142.81, force: 750.502 },
  { name: '等速阶段', duration: 28.03, vStart: 14.14, vEnd: 14.14, distance: 396.29, force: 517.238 },
  { name: '减速阶段', duration: 18.77, vStart: 14.14, vEnd: 1, distance: 142.10, force: 283.973 },
  { name: '爬行阶段', duration: 4.00, vStart: 1, vEnd: 1, distance: 4.00, force: 517.238 },
  { name: '停车阶段', duration: 1.00, vStart: 1, vEnd: 0, distance: 0.50, force: 184.003 },
];

const TOTAL_TIME = 72.00;
const TOTAL_DISTANCE = 685.70;
const CYCLE_ANIM_MS = 20000;
const SCALE = TOTAL_TIME / (CYCLE_ANIM_MS / 1000);
const MAX_SPEED = 15;
const MAX_FORCE = 800;

// ==================== GEOMETRY CONSTANTS ====================
// Drum: center (400, 80), radius 60
const DRUM_CX = 400;
const DRUM_CY = 80;
const DRUM_R = 60;
const DRUM_DIAMETER_REAL = 5;
const DRUM_CIRCUMFERENCE = Math.PI * DRUM_DIAMETER_REAL;

// Rope departure: from drum left/right edges, VERTICALLY downward
const LEFT_ROPE_X = DRUM_CX - DRUM_R;   // 340
const RIGHT_ROPE_X = DRUM_CX + DRUM_R;  // 460
const ROPE_TOP_Y = DRUM_CY;              // 80 — ropes leave from drum center height (sides)

// Skip positions — centered directly below rope departure points
const LEFT_SKIP_CX = 340;
const RIGHT_SKIP_CX = 460;
const SKIP_HEIGHT = 94; // connector(16) + body(76) + gap(2)

// Shaft: skip travel zone
const SHAFT_TOP = 160;     // SVG Y for skip top position (distance=0)
const SHAFT_BOTTOM = 1030; // SVG Y for skip bottom position (distance=685.7m)
const SHAFT_RANGE = SHAFT_BOTTOM - SHAFT_TOP; // 870
const METERS_PER_SVG = TOTAL_DISTANCE / SHAFT_RANGE; // ~0.788 m per SVG unit

// Tail rope (balance rope): fixed total length, hangs as catenary under gravity
// Total length ≈ shaft depth + loop below shaft bottom (72m for counterweight loop)
const TAIL_ROPE_LENGTH_M = TOTAL_DISTANCE + 112; // ~798m
const TAIL_ROPE_LENGTH_SVG = TAIL_ROPE_LENGTH_M / METERS_PER_SVG; // ~962 SVG units

// Time boundaries
const TIME_BOUNDARIES = [0];
{ let acc = 0; for (const s of STAGES) { acc += s.duration; TIME_BOUNDARIES.push(acc); } }

// ==================== PHYSICS ====================
function calculateState(progress) {
  const actualTime = progress * TOTAL_TIME;
  let accTime = 0, accDist = 0;
  for (let i = 0; i < STAGES.length; i++) {
    const s = STAGES[i];
    if (actualTime >= accTime && actualTime < accTime + s.duration) {
      const sp = (actualTime - accTime) / s.duration;
      const speed = s.vStart + (s.vEnd - s.vStart) * sp;
      const dist = s.vStart === s.vEnd
        ? accDist + speed * (actualTime - accTime)
        : accDist + ((s.vStart + speed) / 2) * (actualTime - accTime);
      return { time: actualTime, speed, distance: dist, stage: s.name, stageIndex: i, force: s.force, progress };
    }
    accTime += s.duration;
    accDist += s.distance;
  }
  return { time: TOTAL_TIME, speed: 0, distance: TOTAL_DISTANCE, stage: '完成', stageIndex: -1, force: 0, progress: 1 };
}

// Map distance → SVG Y for skip TOP position
function skipY(distance) {
  return SHAFT_TOP + (distance / TOTAL_DISTANCE) * SHAFT_RANGE;
}

// ==================== CHARTS ====================
const CH = { left: 55, right: 370, top: 15, bottom: 170, w: 315, h: 155 };
function mapX(time) { return CH.left + (time / TOTAL_TIME) * CH.w; }
function mapYSpeed(v) { return CH.bottom - (v / MAX_SPEED) * CH.h; }
function mapYForce(f) { return CH.bottom - (f / MAX_FORCE) * CH.h; }

function buildChart(svgId, yLabels, yUnit, yMapper, curveColor, pointColor) {
  const svg = document.getElementById(svgId);
  const ns = 'http://www.w3.org/2000/svg';
  const bg = document.createElementNS(ns, 'rect');
  bg.setAttribute('x', 0); bg.setAttribute('y', 0); bg.setAttribute('width', 400); bg.setAttribute('height', 200);
  bg.setAttribute('fill', '#0a0f1a'); bg.setAttribute('rx', 6); svg.appendChild(bg);
  yLabels.forEach(val => {
    const y = yMapper(val);
    const grid = document.createElementNS(ns, 'line');
    grid.setAttribute('x1', CH.left); grid.setAttribute('y1', y); grid.setAttribute('x2', CH.right); grid.setAttribute('y2', y);
    grid.setAttribute('stroke', 'rgba(100,140,200,0.08)'); grid.setAttribute('stroke-width', '0.5'); svg.appendChild(grid);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', CH.left - 6); text.setAttribute('y', y + 4); text.setAttribute('text-anchor', 'end');
    text.setAttribute('fill', '#64748b'); text.setAttribute('font-size', '10'); text.setAttribute('font-family', 'var(--font-mono)');
    text.textContent = val; svg.appendChild(text);
  });
  [{ x1: CH.left, y1: CH.top, x2: CH.left, y2: CH.bottom },
   { x1: CH.left, y1: CH.bottom, x2: CH.right, y2: CH.bottom }].forEach(l => {
    const line = document.createElementNS(ns, 'line');
    Object.entries(l).forEach(([k, v]) => line.setAttribute(k, v));
    line.setAttribute('stroke', '#475569'); line.setAttribute('stroke-width', '1'); svg.appendChild(line);
  });
  const yu = document.createElementNS(ns, 'text');
  yu.setAttribute('x', CH.left + 6); yu.setAttribute('y', CH.top + 4); yu.setAttribute('fill', '#64748b');
  yu.setAttribute('font-size', '10'); yu.setAttribute('font-family', 'var(--font-mono)'); yu.textContent = yUnit; svg.appendChild(yu);
  [0, 20, 48, 67, 72].forEach(val => {
    const x = mapX(val);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', x); text.setAttribute('y', CH.bottom + 16); text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#64748b'); text.setAttribute('font-size', '10'); text.setAttribute('font-family', 'var(--font-mono)');
    text.textContent = val === 72 ? '72s' : val; svg.appendChild(text);
    const tick = document.createElementNS(ns, 'line');
    tick.setAttribute('x1', x); tick.setAttribute('y1', CH.bottom); tick.setAttribute('x2', x); tick.setAttribute('y2', CH.bottom + 4);
    tick.setAttribute('stroke', '#475569'); tick.setAttribute('stroke-width', '0.5'); svg.appendChild(tick);
  });
  TIME_BOUNDARIES.slice(1, -1).forEach(t => {
    const x = mapX(t);
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', x); line.setAttribute('y1', CH.top); line.setAttribute('x2', x); line.setAttribute('y2', CH.bottom);
    line.setAttribute('stroke', 'rgba(71,85,105,0.4)'); line.setAttribute('stroke-width', '0.5'); line.setAttribute('stroke-dasharray', '3 3');
    svg.appendChild(line);
  });
  const area = document.createElementNS(ns, 'polygon');
  area.setAttribute('id', svgId + 'Area'); area.setAttribute('fill', curveColor); area.setAttribute('opacity', '0.06'); svg.appendChild(area);
  const polyline = document.createElementNS(ns, 'polyline');
  polyline.setAttribute('id', svgId + 'Polyline'); polyline.setAttribute('fill', 'none');
  polyline.setAttribute('stroke', curveColor); polyline.setAttribute('stroke-width', '2'); polyline.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(polyline);
  const glow = document.createElementNS(ns, 'circle');
  glow.setAttribute('id', svgId + 'Glow'); glow.setAttribute('r', '8'); glow.setAttribute('fill', pointColor);
  glow.setAttribute('opacity', '0.3'); glow.setAttribute('filter', 'url(#glow-point)'); svg.appendChild(glow);
  const circle = document.createElementNS(ns, 'circle');
  circle.setAttribute('id', svgId + 'Point'); circle.setAttribute('r', '4'); circle.setAttribute('fill', pointColor);
  circle.setAttribute('class', 'chart-point--pulse'); svg.appendChild(circle);
  return { polyline, point: circle, glow, area };
}

const speedChart = buildChart('speedChart', [0, 5, 10, 15], 'V(m/s)', mapYSpeed, '#3b82f6', '#ef4444');
const forceChart = buildChart('forceChart', [0, 200, 400, 600, 800], 'F(kN)', mapYForce, '#a78bfa', '#fbbf24');

function applyPolyline(chartEl, points) {
  chartEl.polyline.setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));
  chartEl.area.setAttribute('points',
    points.map(p => `${p.x},${p.y}`).join(' ') +
    ` ${points[points.length-1].x},${CH.bottom} ${points[0].x},${CH.bottom}`);
}

// Speed polyline
applyPolyline(speedChart, [
  { x: mapX(0), y: mapYSpeed(0) },
  { x: mapX(TIME_BOUNDARIES[1]), y: mapYSpeed(14.14) },
  { x: mapX(TIME_BOUNDARIES[2]), y: mapYSpeed(14.14) },
  { x: mapX(TIME_BOUNDARIES[3]), y: mapYSpeed(1) },
  { x: mapX(TIME_BOUNDARIES[4]), y: mapYSpeed(1) },
  { x: mapX(TOTAL_TIME), y: mapYSpeed(0) },
]);

// Force polyline
{ const t = TIME_BOUNDARIES, f = STAGES.map(s => s.force);
  applyPolyline(forceChart, [
    { x: mapX(t[0]), y: mapYForce(f[0]) }, { x: mapX(t[1]), y: mapYForce(f[0]) },
    { x: mapX(t[1]), y: mapYForce(f[1]) }, { x: mapX(t[2]), y: mapYForce(f[1]) },
    { x: mapX(t[2]), y: mapYForce(f[2]) }, { x: mapX(t[3]), y: mapYForce(f[2]) },
    { x: mapX(t[3]), y: mapYForce(f[3]) }, { x: mapX(t[4]), y: mapYForce(f[3]) },
    { x: mapX(t[4]), y: mapYForce(f[4]) }, { x: mapX(TOTAL_TIME), y: mapYForce(f[4]) },
  ]);
}

// ==================== STAGE LIST ====================
{ const container = document.getElementById('stageList');
  STAGES.forEach((s, i) => {
    const div = document.createElement('div'); div.className = 'stage-row'; div.id = 'stageRow' + i;
    div.innerHTML = `<span class="stage-row__name">${s.name}</span><span class="stage-row__force">F=${s.force.toFixed(0)}kN</span><span class="stage-row__time">${s.duration}s</span>`;
    container.appendChild(div);
  });
}

// ==================== DOM CACHE ====================
const $ = id => document.getElementById(id);
const dom = {
  drum: $('drum'),
  skipLeft: $('skip-left'), skipRight: $('skip-right'),
  ropeLeft1: $('rope-left-1'), ropeLeft2: $('rope-left-2'), ropeLeft3: $('rope-left-3'),
  ropeLeftGlow: $('rope-left-glow'),
  ropeRight1: $('rope-right-1'), ropeRight2: $('rope-right-2'), ropeRight3: $('rope-right-3'),
  ropeRightGlow: $('rope-right-glow'),
  tailRope: $('tail-rope'), tailRopeGlow: $('tail-rope-glow'), tailRopeLabel: $('tail-rope-label'),
  annoLeft: $('anno-left'), annoRight: $('anno-right'),
  btnStart: $('btnStart'), btnReset: $('btnReset'),
  dataStage: $('dataStage'), dataTime: $('dataTime'), dataProgress: $('dataProgress'),
  dataSpeed: $('dataSpeed'), dataDistance: $('dataDistance'), dataForce: $('dataForce'),
  speedBar: $('speedBar'), forceBar: $('forceBar'),
  speedPoint: $('speedChartPoint'), speedGlow: $('speedChartGlow'),
  forcePoint: $('forceChartPoint'), forceGlow: $('forceChartGlow'),
  cycleBadge: $('cycleBadge'), runningDot: $('runningDot'),
};

// ==================== ROPE GEOMETRY ====================
// KEY PHYSICS: Ropes drape over the drum and hang VERTICALLY by gravity.
// Left ropes: straight vertical lines from (LEFT_ROPE_X, ROPE_TOP_Y) down to left skip top.
// Right ropes: straight vertical lines from (RIGHT_ROPE_X, ROPE_TOP_Y) down to right skip top.
function computeRopePaths(leftY, rightY) {
  const offsets = [-5, 0, 5]; // 3 visible ropes per side
  const lPaths = [], rPaths = [];
  for (const off of offsets) {
    // Left: vertical line from drum left edge down to skip top
    lPaths.push(`M${LEFT_ROPE_X + off},${ROPE_TOP_Y} L${LEFT_SKIP_CX + off},${leftY}`);
    // Right: vertical line from drum right edge down to skip top
    rPaths.push(`M${RIGHT_ROPE_X + off},${ROPE_TOP_Y} L${RIGHT_SKIP_CX + off},${rightY}`);
  }
  return { left: lPaths, right: rPaths };
}

// Proper catenary tail rope: fixed total length, natural gravity sag
// The tail rope (balance rope) has a FIXED length and hangs freely between the two skip bottoms.
// It forms a catenary curve. When skips are far apart, rope is tauter.
// When skips are close together, rope has more slack and sags deeper below.
function computeTailRope(leftBottomY, rightBottomY) {
  const lx = LEFT_SKIP_CX;
  const rx = RIGHT_SKIP_CX;
  const ly = leftBottomY;
  const ry = rightBottomY;
  const d = rx - lx;               // horizontal span (240 SVG units)
  const L = TAIL_ROPE_LENGTH_SVG;  // fixed rope length in SVG units

  // Solve for catenary parameter 'a' using bisection
  // Full catenary constraint: L² = (2a·sinh(d/(2a)))² + h²
  // where h = vertical separation between endpoints
  const h = Math.abs(ry - ly);
  const Lh2 = L * L - h * h; // L² - h² = horizontal arc length squared
  if (Lh2 <= 0) {
    // Rope barely reaches — draw straight line
    return { path: `M${lx},${ly} L${rx},${ry}`, lowestY: Math.max(ly, ry), lowestX: (lx + rx) / 2 };
  }
  const Lh = Math.sqrt(Lh2); // horizontal component of arc length
  let aLo = d * 0.01;
  let aHi = d * 100;
  for (let i = 0; i < 50; i++) {
    const aMid = (aLo + aHi) / 2;
    const horizArc = 2 * aMid * Math.sinh(d / (2 * aMid));
    if (horizArc > Lh) aLo = aMid; else aHi = aMid;
  }
  const a = (aLo + aHi) / 2;

  // Generate curve points (symmetric catenary, then adjust for height difference)
  const N = 30;
  const points = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = lx + t * d;
    // Symmetric catenary: y(t) = a*(cosh((2t-1)*d/(2a)) - cosh(d/(2a)))
    const symY = a * (Math.cosh((2 * t - 1) * d / (2 * a)) - Math.cosh(d / (2 * a)));
    // Interpolate between endpoints and add catenary sag
    const baseY = ly + t * (ry - ly);
    points.push({ x, y: baseY - symY }); // symY is negative (below), so subtracting = adding sag
  }

  // Build SVG cubic Bézier path for smooth rendering
  let path = `M${points[0].x.toFixed(1)},${points[0].y.toFixed(1)}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i];
    const p1 = points[i + 1];
    const segDx = (p1.x - p0.x) / 3;
    const dy0 = i > 0 ? (points[i + 1].y - points[i - 1].y) / (points[i + 1].x - points[i - 1].x) : 0;
    const dy1 = i < points.length - 2 ? (points[i + 2].y - points[i].y) / (points[i + 2].x - points[i].x) : 0;
    const cp1x = p0.x + segDx;
    const cp1y = p0.y + dy0 * segDx;
    const cp2x = p1.x - segDx;
    const cp2y = p1.y - dy1 * segDx;
    path += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p1.x.toFixed(1)},${p1.y.toFixed(1)}`;
  }

  // Lowest point (at midpoint) for label positioning
  const lowestY = ly + (ry - ly) / 2 - a * (Math.cosh(d / (2 * a)) - 1) * -1;
  // Actually: symY at midpoint (t=0.5) = a*(cosh(0) - cosh(d/(2a))) = a*(1 - cosh(d/(2a)))
  const midSag = a * (Math.cosh(d / (2 * a)) - 1); // positive = how far below endpoints
  const lowestPointY = (ly + ry) / 2 + midSag;

  return { path, lowestY: lowestPointY, lowestX: (lx + rx) / 2 };
}

// ==================== FRAME RENDERER ====================
let drumRotation = 0;

function applyFrame(state) {
  // Drum rotation: simple speed-based accumulation (matching reference: speed × 0.3 per frame)
  drumRotation += state.speed * 0.3;
  dom.drum.setAttribute('transform', `rotate(${drumRotation}, ${DRUM_CX}, ${DRUM_CY})`);

  // Skip positions: left descends, right ascends
  const leftDist = state.distance;
  const rightDist = TOTAL_DISTANCE - state.distance;
  const leftY = skipY(leftDist);   // top of left skip
  const rightY = skipY(rightDist); // top of right skip

  dom.skipLeft.setAttribute('transform', `translate(0, ${leftY})`);
  dom.skipRight.setAttribute('transform', `translate(0, ${rightY})`);

  // Ropes: vertical from drum edges to skip tops
  const ropes = computeRopePaths(leftY, rightY);
  dom.ropeLeft1.setAttribute('d', ropes.left[0]);
  dom.ropeLeft2.setAttribute('d', ropes.left[1]);
  dom.ropeLeft3.setAttribute('d', ropes.left[2]);
  dom.ropeLeftGlow.setAttribute('d', ropes.left[0]);
  dom.ropeRight1.setAttribute('d', ropes.right[0]);
  dom.ropeRight2.setAttribute('d', ropes.right[1]);
  dom.ropeRight3.setAttribute('d', ropes.right[2]);
  dom.ropeRightGlow.setAttribute('d', ropes.right[0]);

  // Tail rope — proper catenary with fixed rope length
  const leftBottomY = leftY + SKIP_HEIGHT;
  const rightBottomY = rightY + SKIP_HEIGHT;
  const tailRopeResult = computeTailRope(leftBottomY, rightBottomY);
  dom.tailRope.setAttribute('d', tailRopeResult.path);
  dom.tailRopeGlow.setAttribute('d', tailRopeResult.path);
  dom.tailRopeLabel.setAttribute('x', tailRopeResult.lowestX);
  dom.tailRopeLabel.setAttribute('y', tailRopeResult.lowestY + 18);

  // Annotations
  const travelPct = (state.distance / TOTAL_DISTANCE) * 100;
  dom.annoLeft.textContent = travelPct > 90 ? '井底装载 ←' : travelPct < 10 ? '井口卸载 ←' : '';
  dom.annoLeft.setAttribute('y', leftY + 52);
  dom.annoRight.textContent = travelPct < 10 ? '→ 井口卸载' : travelPct > 90 ? '→ 井底装载' : '';
  dom.annoRight.setAttribute('y', rightY + 52);

  // Chart tracking points
  const sx = mapX(state.time), sy = mapYSpeed(state.speed);
  const fx = mapX(state.time), fy = mapYForce(state.force);
  dom.speedPoint.setAttribute('cx', sx); dom.speedPoint.setAttribute('cy', sy);
  dom.speedGlow.setAttribute('cx', sx); dom.speedGlow.setAttribute('cy', sy);
  dom.forcePoint.setAttribute('cx', fx); dom.forcePoint.setAttribute('cy', fy);
  dom.forceGlow.setAttribute('cx', fx); dom.forceGlow.setAttribute('cy', fy);

  // Telemetry
  dom.dataStage.textContent = state.stage || '--';
  dom.dataTime.innerHTML = `${state.time.toFixed(2)}<span class="telemetry-unit">s</span>`;
  dom.dataProgress.textContent = `循环进度: ${(state.progress * 100).toFixed(1)}%`;
  dom.dataSpeed.innerHTML = `${state.speed.toFixed(2)}<span class="telemetry-unit">m/s</span>`;
  dom.dataDistance.innerHTML = `${state.distance.toFixed(2)}<span class="telemetry-unit">m</span>`;
  dom.dataForce.innerHTML = `${state.force.toFixed(1)}<span class="telemetry-unit">kN</span>`;
  dom.speedBar.style.width = (state.speed / 14.14 * 100) + '%';
  dom.forceBar.style.width = (state.force / MAX_FORCE * 100) + '%';
  dom.cycleBadge.textContent = `CYCLE ${(state.progress * 100).toFixed(1)}%`;

  // Stage highlighting
  STAGES.forEach((_, i) => {
    const el = $('stageRow' + i);
    if (el) el.classList.toggle('stage-row--active', i === state.stageIndex);
  });
}

// ==================== ANIMATION LOOP ====================
let running = false, rafId = null, startTs = null, savedProgress = 0;

function tick(timestamp) {
  if (startTs === null) startTs = timestamp;
  const realSec = (timestamp - startTs) / 1000;
  const animSec = savedProgress * TOTAL_TIME + realSec * SCALE;
  const progress = (animSec % TOTAL_TIME) / TOTAL_TIME;
  applyFrame(calculateState(progress));
  if (running) rafId = requestAnimationFrame(tick);
}

function start() {
  running = true; startTs = null;
  dom.btnStart.textContent = '⏸ 暂停'; dom.btnStart.classList.add('running');
  dom.runningDot.classList.add('active');
  rafId = requestAnimationFrame(tick);
}

function stop() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  if (startTs !== null) {
    const realSec = (performance.now() - startTs) / 1000;
    savedProgress = ((savedProgress * TOTAL_TIME + realSec * SCALE) % TOTAL_TIME) / TOTAL_TIME;
  }
  startTs = null;
  dom.btnStart.textContent = '▶ 继续'; dom.btnStart.classList.remove('running');
  dom.runningDot.classList.remove('active');
}

function reset() {
  running = false;
  if (rafId) cancelAnimationFrame(rafId);
  startTs = null; savedProgress = 0; drumRotation = 0;
  dom.btnStart.textContent = '▶ 开始'; dom.btnStart.classList.remove('running');
  dom.runningDot.classList.remove('active');
  applyFrame(calculateState(0));
}

// ==================== EVENTS ====================
dom.btnStart.addEventListener('click', () => { running ? stop() : start(); });
dom.btnReset.addEventListener('click', reset);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) { e.preventDefault(); running ? stop() : start(); }
  if (e.code === 'KeyR' && !e.repeat && !e.metaKey && !e.ctrlKey) reset();
});

// ==================== INIT ====================
applyFrame(calculateState(0), 0);
</script>
</body>
</html>
